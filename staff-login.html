<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Staff — BUSINESS.</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.28), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.18), transparent 35%),
                linear-gradient(135deg, #050507, #0b0713 50%, #130820);
        }

        body::before {
            content: "BUSINESS.";
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(80px, 18vw, 260px);
            font-weight: 900;
            letter-spacing: -10px;
            color: rgba(255, 255, 255, 0.025);
            white-space: nowrap;
            pointer-events: none;
        }

        .glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.12);
            filter: blur(100px);
            pointer-events: none;
        }

        .glow.one {
            top: -180px;
            left: -150px;
        }

        .glow.two {
            right: -180px;
            bottom: -180px;
        }

        .login-box {
            position: relative;
            z-index: 2;
            width: min(440px, calc(100% - 40px));
            padding: 42px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.055);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 38px;
        }

        .logo span {
            color: #a855f7;
        }

        .lock {
            width: 68px;
            height: 68px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            box-shadow: 0 15px 35px rgba(124, 58, 237, 0.35);
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 14px;
            outline: none;
            background: rgba(0, 0, 0, 0.25);
            color: white;
            font-size: 16px;
            transition: 0.25s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        input:focus {
            border-color: rgba(168, 85, 247, 0.8);
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.10);
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: 800;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            box-shadow: 0 15px 35px rgba(124, 58, 237, 0.25);
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 45px rgba(124, 58, 237, 0.35);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .error {
            display: none;
            margin-top: 18px;
            padding: 13px 15px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            font-size: 14px;
            text-align: center;
        }

        .back {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.45);
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 30px 24px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="login-box">

        <div class="logo">
            BUSINESS<span>.</span>
        </div>

        <div class="lock">
            🔐
        </div>

        <h1>Espace Staff</h1>

        <p class="subtitle">
            Cette zone est réservée aux membres autorisés du staff.
        </p>

        <form id="loginForm">

            <label for="password">
                Mot de passe
            </label>

            <div class="input-wrapper">
                <input
                    type="password"
                    id="password"
                    placeholder="Entre le mot de passe"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="loginButton">
                Se connecter →
            </button>

        </form>

        <div class="error" id="error"></div>

        <a href="page2.html" class="back">
            ← Retour au site
        </a>

    </main>

    <script>
        const form = document.getElementById("loginForm");
        const passwordInput = document.getElementById("password");
        const button = document.getElementById("loginButton");
        const errorBox = document.getElementById("error");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            errorBox.style.display = "none";
            button.disabled = true;
            button.textContent = "Connexion...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        password: passwordInput.value
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = "/staff.html";
                    return;
                }

                errorBox.textContent =
                    data.message || "Mot de passe incorrect.";

                errorBox.style.display = "block";

            } catch (error) {
                errorBox.textContent =
                    "Impossible de contacter le serveur.";

                errorBox.style.display = "block";
            }

            button.disabled = false;
            button.textContent = "Se connecter →";
        });
    </script>

</body>
</html>
