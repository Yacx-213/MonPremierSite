<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion Staff - Mon Premier Site</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <header class="navbar">

        <a
            href="page2.html"
            class="logo"
        >
            MON <span>PREMIER</span> SITE
        </a>

        <nav class="nav-links">

            <a href="page2.html">
                Accueil
            </a>

            <a href="innovation.html">
                Innovation
            </a>

            <a href="creativite.html">
                Créativité
            </a>

            <a href="ambition.html">
                Ambition
            </a>

        </nav>

    </header>


    <main class="hero">

        <div class="hero-content">

            <div class="badge">
                🔐 ESPACE STAFF
            </div>

            <h1>
                Connexion
                <span>Staff</span>
            </h1>

            <p>
                Connecte-toi pour accéder au panneau
                d'administration.
            </p>


            <div
                class="glass form-card"
                style="
                    max-width:460px;
                    margin:35px auto 0;
                    text-align:left;
                "
            >

                <div
                    id="notice"
                    class="notice"
                ></div>


                <form id="loginForm">

                    <div class="field">

                        <label
                            for="password"
                        >
                            Mot de passe
                        </label>

                        <input
                            id="password"
                            class="input"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Mot de passe Staff"
                            required
                        >

                    </div>


                    <button
                        id="loginButton"
                        class="btn btn-primary"
                        type="submit"
                        style="
                            width:100%;
                            margin-top:18px;
                        "
                    >
                        Se connecter →
                    </button>

                </form>

            </div>


            <div class="hero-actions">

                <a
                    href="page2.html"
                    class="btn"
                >
                    ← Retour au site
                </a>

            </div>

        </div>

    </main>


    <footer>
        © 2026 Mon Premier Site — Staff
    </footer>


    <script src="background.js"></script>


    <script>

        const form =
            document.getElementById(
                "loginForm"
            );

        const notice =
            document.getElementById(
                "notice"
            );

        const button =
            document.getElementById(
                "loginButton"
            );


        function showNotice(
            message,
            type = "error"
        ) {

            notice.textContent =
                message;

            notice.className =
                "notice show " + type;

        }


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                button.disabled =
                    true;

                button.textContent =
                    "Connexion...";


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                try {

                    const response =
                        await fetch(
                            "/api/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        data.success === false
                    ) {

                        throw new Error(
                            data.message ||
                            "Connexion impossible."
                        );

                    }


                    location.href =
                        "/staff.html";

                }
                catch (error) {

                    showNotice(
                        error.message,
                        "error"
                    );

                    button.disabled =
                        false;

                    button.textContent =
                        "Se connecter →";

                }

            }
        );

    </script>

</body>

</html>
