<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Espace Staff — BUSINESS.</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top left,
                    #29104d,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #35105c,
                    transparent 35%
                ),
                #07050d;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            background:
                rgba(7, 5, 13, 0.78);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
        }

        .logo span {
            color: #a855f7;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-button {
            padding: 10px 14px;

            border-radius: 10px;

            border:
                1px solid rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.05);

            color: #ddd6e5;

            cursor: pointer;

            transition: 0.25s;
        }

        .nav-button:hover {
            background:
                rgba(255,255,255,0.09);

            color: white;
        }

        .logout {
            color: #fca5a5;

            border-color:
                rgba(239,68,68,0.15);
        }

        .logout:hover {
            background:
                rgba(239,68,68,0.1);
        }

        /* =========================
           CONTENEUR
        ========================= */

        .container {
            width: min(1250px, 92%);

            margin: 45px auto 80px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            margin-bottom: 35px;
        }

        .tag {
            display: inline-block;

            padding: 8px 14px;

            border-radius: 999px;

            background:
                rgba(168,85,247,0.12);

            border:
                1px solid rgba(168,85,247,0.25);

            color: #c084fc;

            font-size: 11px;
            font-weight: bold;

            letter-spacing: 1px;

            text-transform: uppercase;

            margin-bottom: 15px;
        }

        .header h1 {
            font-size:
                clamp(36px, 5vw, 58px);

            letter-spacing: -2px;

            margin-bottom: 10px;
        }

        .header p {
            color: #918a9a;

            line-height: 1.6;
        }

        /* =========================
           NAVIGATION DES SECTIONS
        ========================= */

        .section-tabs {
            display: flex;
            gap: 10px;

            margin-bottom: 25px;

            padding: 6px;

            width: fit-content;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid rgba(255,255,255,0.08);
        }

        .tab {
            padding: 12px 18px;

            border: none;
            border-radius: 10px;

            background: transparent;

            color: #8f8799;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .tab:hover {
            color: white;
        }

        .tab.active {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            box-shadow:
                0 8px 20px
                rgba(124,58,237,0.2);
        }

        /* =========================
           STATISTIQUES
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .stat {
            padding: 22px;

            border-radius: 18px;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid rgba(255,255,255,0.08);
        }

        .stat-label {
            color: #81798b;

            font-size: 12px;

            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 900;
        }

        /* =========================
           OUTILS
        ========================= */

        .tools {
            display: flex;

            gap: 12px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 240px;
        }

        .search input,
        .filter {
            width: 100%;

            padding: 14px 15px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,0.1);

            outline: none;

            background:
                rgba(0,0,0,0.2);

            color: white;
        }

        .search input:focus,
        .filter:focus {
            border-color:
                rgba(168,85,247,0.6);
        }

        .filter {
            width: 190px;
        }

        .filter option {
            background: #15101d;
            color: white;
        }

        /* =========================
           LISTE
        ========================= */

        .list {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .empty {
            padding: 55px 20px;

            text-align: center;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid rgba(255,255,255,0.07);

            color: #777080;
        }

        .item {
            position: relative;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 20px 22px;

            border-radius: 18px;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid rgba(255,255,255,0.08);

            cursor: pointer;

            transition:
                transform 0.2s,
                background 0.2s,
                border 0.2s;
        }

        .item:hover {
            transform: translateY(-2px);

            background:
                rgba(168,85,247,0.06);

            border-color:
                rgba(168,85,247,0.25);
        }

        .item.new {
            border-left:
                3px solid #22c55e;
        }

        .item-main {
            min-width: 0;
            flex: 1;
        }

        .item-top {
            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 8px;
        }

        .item-title {
            font-size: 17px;
            font-weight: bold;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-info {
            display: flex;

            gap: 16px;

            flex-wrap: wrap;

            color: #827a8b;

            font-size: 13px;
        }

        .item-date {
            color: #696171;
            font-size: 12px;
        }

        .type-badge,
        .status-badge {
            display: inline-flex;

            align-items: center;

            padding: 5px 9px;

            border-radius: 999px;

            font-size: 10px;

            font-weight: bold;
        }

        .type-badge {
            background:
                rgba(168,85,247,0.1);

            color: #c084fc;
        }

        .status-badge {
            background:
                rgba(255,255,255,0.06);

            color: #aaa2b5;
        }

        .status-new {
            color: #86efac;

            background:
                rgba(34,197,94,0.1);
        }

        .status-progress {
            color: #fcd34d;

            background:
                rgba(234,179,8,0.1);
        }

        .status-done {
            color: #93c5fd;

            background:
                rgba(59,130,246,0.1);
        }

        .new-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 10px #22c55e;

            animation:
                pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        /* =========================
           MODALE
        ========================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            z-index: 500;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,0.72);

            backdrop-filter:
                blur(8px);
        }

        .modal {
            width: min(700px, 100%);

            max-height: 90vh;

            overflow-y: auto;

            padding: 30px;

            border-radius: 24px;

            background:
                #100c17;

            border:
                1px solid rgba(255,255,255,0.1);

            box-shadow:
                0 30px 100px
                rgba(0,0,0,0.6);
        }

        .modal-header {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 25px;

            line-height: 1.2;
        }

        .close {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            border: none;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.06);

            color: white;

            cursor: pointer;

            font-size: 18px;
        }

        .close:hover {
            background:
                rgba(255,255,255,0.1);
        }

        .details {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-bottom: 20px;
        }

        .detail {
            padding: 15px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid rgba(255,255,255,0.06);
        }

        .detail-label {
            color: #716979;

            font-size: 11px;

            margin-bottom: 6px;

            text-transform: uppercase;
        }

        .detail-value {
            color: #e7e1eb;

            font-size: 14px;

            word-break: break-word;
        }

        .message-box {
            padding: 20px;

            border-radius: 15px;

            background:
                rgba(0,0,0,0.2);

            border:
                1px solid rgba(255,255,255,0.06);

            margin-bottom: 22px;
        }

        .message-label {
            color: #8f8799;

            font-size: 12px;

            margin-bottom: 10px;

            text-transform: uppercase;
        }

        .message {
            color: #d9d3df;

            line-height: 1.7;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .modal-actions {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .modal-actions select {
            flex: 1;

            min-width: 180px;

            padding: 13px;

            border-radius: 11px;

            border:
                1px solid rgba(255,255,255,0.1);

            background:
                rgba(255,255,255,0.05);

            color: white;

            outline: none;
        }

        .modal-actions select option {
            background: #15101d;
        }

        .action-button {
            padding: 13px 17px;

            border: none;

            border-radius: 11px;

            cursor: pointer;

            color: white;

            font-weight: bold;
        }

        .save {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );
        }

        .delete {
            background:
                rgba(239,68,68,0.12);

            color: #fca5a5;

            border:
                1px solid rgba(239,68,68,0.18);
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .item {
                align-items: flex-start;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            nav {
                padding: 0 4%;
            }

            .nav-button {
                font-size: 12px;
                padding: 9px 10px;
            }

            .container {
                width: 94%;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .section-tabs {
                width: 100%;
            }

            .tab {
                flex: 1;
                padding: 11px 8px;
                font-size: 12px;
            }

            .filter {
                width: 100%;
            }

            .modal {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <div class="logo">
            BUSINESS<span>.</span>
        </div>

        <div class="nav-right">

            <button
                class="nav-button"
                onclick="loadCurrentSection()"
            >
                ↻ Actualiser
            </button>

            <button
                class="nav-button logout"
                onclick="logout()"
            >
                Déconnexion
            </button>

        </div>

    </nav>


    <!-- =========================
         CONTENU
    ========================= -->

    <main class="container">

        <header class="header">

            <div class="tag">
                🛡️ Administration
            </div>

            <h1>
                Espace <span>Staff.</span>
            </h1>

            <p>
                Gérez les demandes et les fiches de vie
                de la communauté.
            </p>

        </header>


        <!-- =========================
             ONGLETS
        ========================= -->

        <div class="section-tabs">

            <button
                class="tab active"
                id="ticketsTab"
                onclick="switchSection('tickets')"
            >
                🎫 Tickets
            </button>

            <button
                class="tab"
                id="viesTab"
                onclick="switchSection('vies')"
            >
                👤 Fiches de vie
            </button>

        </div>


        <!-- =========================
             TICKETS
        ========================= -->

        <section id="ticketsSection">

            <div class="stats">

                <div class="stat">

                    <div class="stat-label">
                        TOTAL
                    </div>

                    <div
                        class="stat-value"
                        id="ticketTotal"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        NOUVEAUX
                    </div>

                    <div
                        class="stat-value"
                        id="ticketNew"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        EN COURS
                    </div>

                    <div
                        class="stat-value"
                        id="ticketProgress"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        TRAITÉS
                    </div>

                    <div
                        class="stat-value"
                        id="ticketDone"
                    >
                        0
                    </div>

                </div>

            </div>


            <div class="tools">

                <div class="search">

                    <input
                        type="text"
                        id="ticketSearch"
                        placeholder="🔎 Rechercher un ticket..."
                        oninput="renderTickets()"
                    >

                </div>


                <select
                    class="filter"
                    id="ticketFilter"
                    onchange="renderTickets()"
                >

                    <option value="all">
                        Tous les statuts
                    </option>

                    <option value="Nouveau">
                        Nouveau
                    </option>

                    <option value="En cours">
                        En cours
                    </option>

                    <option value="Traité">
                        Traité
                    </option>

                </select>

            </div>


            <div
                class="list"
                id="ticketList"
            ></div>

        </section>


        <!-- =========================
             FICHES DE VIE
        ========================= -->

        <section
            id="viesSection"
            style="display:none;"
        >

            <div class="stats">

                <div class="stat">

                    <div class="stat-label">
                        TOTAL
                    </div>

                    <div
                        class="stat-value"
                        id="vieTotal"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        NOUVELLES
                    </div>

                    <div
                        class="stat-value"
                        id="vieNew"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        EN COURS
                    </div>

                    <div
                        class="stat-value"
                        id="vieProgress"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        TRAITÉES
                    </div>

                    <div
                        class="stat-value"
                        id="vieDone"
                    >
                        0
                    </div>

                </div>

            </div>


            <div class="tools">

                <div class="search">

                    <input
                        type="text"
                        id="vieSearch"
                        placeholder="🔎 Rechercher une fiche..."
                        oninput="renderVies()"
                    >

                </div>


                <select
                    class="filter"
                    id="vieFilter"
                    onchange="renderVies()"
                >

                    <option value="all">
                        Tous les statuts
                    </option>

                    <option value="Nouveau">
                        Nouveau
                    </option>

                    <option value="En cours">
                        En cours
                    </option>

                    <option value="Traité">
                        Traité
                    </option>

                </select>

            </div>


            <div
                class="list"
                id="vieList"
            ></div>

        </section>

    </main>


    <!-- =========================
         MODALE
    ========================= -->

    <div
        class="modal-overlay"
        id="modalOverlay"
        onclick="closeModalFromOverlay(event)"
    >

        <div class="modal">

            <div class="modal-header">

                <div>

                    <div
                        class="tag"
                        id="modalTag"
                    >
                        Ticket
                    </div>

                    <h2
                        class="modal-title"
                        id="modalTitle"
                    >
                        Détails
                    </h2>

                </div>

                <button
                    class="close"
                    onclick="closeModal()"
                >
                    ×
                </button>

            </div>


            <div
                class="details"
                id="modalDetails"
            ></div>


            <div class="message-box">

                <div
                    class="message-label"
                    id="messageLabel"
                >
                    Message
                </div>

                <div
                    class="message"
                    id="modalMessage"
                ></div>

            </div>


            <div class="modal-actions">

                <select
                    id="modalStatus"
                >

                    <option value="Nouveau">
                        Nouveau
                    </option>

                    <option value="En cours">
                        En cours
                    </option>

                    <option value="Traité">
                        Traité
                    </option>

                </select>


                <button
                    class="action-button save"
                    onclick="saveCurrentStatus()"
                >
                    Enregistrer
                </button>


                <button
                    class="action-button delete"
                    onclick="deleteCurrentItem()"
                >
                    Supprimer
                </button>

            </div>

        </div>

    </div>


    <script>

        // =========================
        // VARIABLES
        // =========================

        let tickets = [];

        let vies = [];

        let currentSection = "tickets";

        let currentItem = null;


        // =========================
        // ÉCHAPPEMENT HTML
        // =========================

        function escapeHTML(value) {

            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        // =========================
        // DATE
        // =========================

        function formatDate(date) {

            if (!date) {
                return "Date inconnue";
            }

            return new Date(date)
                .toLocaleString(
                    "fr-FR",
                    {
                        dateStyle: "medium",
                        timeStyle: "short"
                    }
                );
        }


        // =========================
        // STATUT
        // =========================

        function statusClass(status) {

            if (status === "Nouveau") {
                return "status-new";
            }

            if (status === "En cours") {
                return "status-progress";
            }

            if (status === "Traité") {
                return "status-done";
            }

            return "";
        }


        // =========================
        // TYPE TICKET
        // =========================

        function typeIcon(type) {

            const icons = {

                "Support": "🛠️",

                "Commande": "📦",

                "Partenariat": "🤝",

                "Autre": "💬"

            };

            return icons[type] || "💬";
        }


        // =========================
        // CHANGER DE SECTION
        // =========================

        function switchSection(section) {

            currentSection = section;

            const ticketsSection =
                document.getElementById(
                    "ticketsSection"
                );

            const viesSection =
                document.getElementById(
                    "viesSection"
                );

            const ticketsTab =
                document.getElementById(
                    "ticketsTab"
                );

            const viesTab =
                document.getElementById(
                    "viesTab"
                );


            if (section === "tickets") {

                ticketsSection.style.display =
                    "block";

                viesSection.style.display =
                    "none";

                ticketsTab.classList.add(
                    "active"
                );

                viesTab.classList.remove(
                    "active"
                );

                loadTickets();

            } else {

                ticketsSection.style.display =
                    "none";

                viesSection.style.display =
                    "block";

                ticketsTab.classList.remove(
                    "active"
                );

                viesTab.classList.add(
                    "active"
                );

                loadVies();
            }
        }


        // =========================
        // CHARGER TICKETS
        // =========================

        async function loadTickets() {

            try {

                const response =
                    await fetch(
                        "/api/tickets",
                        {
                            credentials: "include"
                        }
                    );


                if (response.status === 401) {

                    window.location.href =
                        "/staff-login.html";

                    return;
                }


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Impossible de charger les tickets."
                    );
                }


                tickets =
                    Array.isArray(data.tickets)
                        ? data.tickets
                        : [];


                updateTicketStats();

                renderTickets();


            } catch (error) {

                document.getElementById(
                    "ticketList"
                ).innerHTML = `

                    <div class="empty">
                        Erreur lors du chargement des tickets.
                    </div>

                `;

                console.error(error);
            }
        }


        // =========================
        // CHARGER VIES
        // =========================

        async function loadVies() {

            try {

                const response =
                    await fetch(
                        "/api/vies",
                        {
                            credentials: "include"
                        }
                    );


                if (response.status === 401) {

                    window.location.href =
                        "/staff-login.html";

                    return;
                }


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Impossible de charger les fiches."
                    );
                }


                vies =
                    Array.isArray(data.vies)
                        ? data.vies
                        : [];


                updateVieStats();

                renderVies();


            } catch (error) {

                document.getElementById(
                    "vieList"
                ).innerHTML = `

                    <div class="empty">
                        Erreur lors du chargement des fiches de vie.
                    </div>

                `;

                console.error(error);
            }
        }


        // =========================
        // STATS TICKETS
        // =========================

        function updateTicketStats() {

            document.getElementById(
                "ticketTotal"
            ).textContent =
                tickets.length;


            document.getElementById(
                "ticketNew"

        // =========================
        // AFFICHER TICKETS
        // =========================

        function renderTickets() {

            const list =
                document.getElementById(
                    "ticketList"
                );


            const search =
                document.getElementById(
                    "ticketSearch"
                ).value
                .toLowerCase()
                .trim();


            const filter =
                document.getElementById(
                    "ticketFilter"
                ).value;


            const filtered =
                tickets.filter(
                    ticket => {

                        const text = [

                            ticket.sujet,

                            ticket.nom,

                            ticket.discord,

                            ticket.message,

                            ticket.type

                        ]
                        .join(" ")
                        .toLowerCase();


                        const matchesSearch =
                            !search ||
                            text.includes(search);


                        const matchesFilter =
                            filter === "all" ||
                            ticket.status === filter;


                        return (
                            matchesSearch &&
                            matchesFilter
                        );
                    }
                );


            if (filtered.length === 0) {

                list.innerHTML = `

                    <div class="empty">
                        Aucun ticket trouvé.
                    </div>

                `;

                return;
            }


            list.innerHTML =
                filtered
                    .map(
                        ticket => `

                            <div
                                class="item ${
                                    ticket.status === "Nouveau"
                                        ? "new"
                                        : ""
                                }"
                                onclick="openTicket(${ticket.id})"
                            >

                                <div class="item-main">

                                    <div class="item-top">

                                        ${
                                            ticket.status === "Nouveau"
                                                ? '<span class="new-dot"></span>'
                                                : ""
                                        }

                                        <span class="item-title">
                                            ${escapeHTML(ticket.sujet)}
                                        </span>

                                        <span class="type-badge">
                                            ${typeIcon(ticket.type)}
                                            ${escapeHTML(ticket.type)}
                                        </span>

                                        <span class="status-badge ${statusClass(ticket.status)}">
                                            ${escapeHTML(ticket.status)}
                                        </span>

                                    </div>

                                    <div class="item-info">

                                        <span>
                                            👤 ${escapeHTML(ticket.nom)}
                                        </span>

                                        <span>
                                            🎮 ${escapeHTML(ticket.discord)}
                                        </span>

                                    </div>

                                </div>

                                <div class="item-date">
                                    ${formatDate(ticket.date)}
                                </div>

                            </div>

                        `
                    )
                    .join("");
        }

        // =========================

        // =========================
        // FERMER MODALE
        // =========================

        function closeModal() {

            document.getElementById(
                "modalOverlay"
            ).style.display =
                "none";

            currentItem = null;
        }


        function closeModalFromOverlay(event) {

            if (
                event.target ===
                document.getElementById(
                    "modalOverlay"
                )
            ) {

                closeModal();
            }
        }


        // =========================
        // SAUVER STATUT
        // =========================

        async function saveCurrentStatus() {

            if (!currentItem) {
                return;
            }


            const status =
                document.getElementById(
                    "modalStatus"
                ).value;


            const id =
                currentItem.data.id;


            const endpoint =
                currentItem.type === "ticket"
                    ? `/api/tickets/${id}`
                    : `/api/vies/${id}`;


            try {

                const response =
                    await fetch(
                        endpoint,
                        {

                            method: "PATCH",

                            credentials:
                                "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    status
                                })

                        }
                    );


                if (response.status === 401) {

                    window.location.href =
                        "/staff-login.html";

                    return;
                }


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Erreur."
                    );
                }


                closeModal();


                if (
                    currentSection ===
                    "tickets"
                ) {

                    await loadTickets();

                } else {

                    await loadVies();
                }


            } catch (error) {

                alert(
                    error.message
                );
            }
        }


        // =========================
        // SUPPRIMER
        // =========================

        async function deleteCurrentItem() {

            if (!currentItem) {
                return;
            }


            const confirmation =
                confirm(
                    "Voulez-vous vraiment supprimer cet élément ?"
                );


            if (!confirmation) {
                return;
            }


            const id =
                currentItem.data.id;


            const endpoint =
                currentItem.type === "ticket"
                    ? `/api/tickets/${id}`
                    : `/api/vies/${id}`;


            try {

                const response =
                    await fetch(
                        endpoint,
                        {

                            method: "DELETE",

                            credentials:
                                "include"

                        }
                    );


                if (response.status === 401) {

                    window.location.href =
                        "/staff-login.html";

                    return;
                }


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Erreur."
                    );
                }


                closeModal();


                if (
                    currentSection ===
                    "tickets"
                ) {

                    await loadTickets();

                } else {

                    await loadVies();
                }


            } catch (error) {

                alert(
                    error.message
                );
            }
        }


        // =========================
        // ACTUALISER
        // =========================

        function loadCurrentSection() {

            if (
                currentSection ===
                "tickets"
            ) {

                loadTickets();

            } else {

                loadVies();
            }
        }


        // =========================
        // DÉCONNEXION
        // =========================

        async function logout() {

            try {

                await fetch(
                    "/api/logout",
                    {
                        method: "POST",
                        credentials: "include"
                    }
                );

            } finally {

                window.location.href =
                    "/staff-login.html";
            }
        }


        // =========================
        // VÉRIFICATION SESSION
        // =========================

        async function checkSession() {

            try {

                const response =
                    await fetch(
                        "/api/session",
                        {
                            credentials: "include"
                        }
                    );


                const data =
                    await response.json();


                if (
                    !data.loggedIn
                ) {

                    window.location.href =
                        "/staff-login.html";

                    return false;
                }


                return true;


            } catch (error) {

                window.location.href =
                    "/staff-login.html";

                return false;
            }
        }


        // =========================
        // DÉMARRAGE
        // =========================

        async function init() {

            const loggedIn =
                await checkSession();


            if (!loggedIn) {
                return;
            }


            await loadTickets();
        }


        init();

    </script>
